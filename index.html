<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>✨ Neon Memory Match ✨</title>
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b0b1a;
      background-image: radial-gradient(circle at 20% 30%, #1a1a3e, #0a0a12);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* ----- GAME CONTAINER (neon glow) ----- */
    .game-wrapper {
      max-width: 780px;
      width: 100%;
      background: rgba(10, 10, 30, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 3rem 3rem 2rem 2rem;
      padding: 1.8rem 1.5rem 2rem;
      box-shadow: 0 0 30px #6a4eff66, 0 0 60px #3a2b9e33, inset 0 0 20px #a07eff22;
      border: 1px solid #7a6eff55;
      transition: box-shadow 0.3s;
    }

    /* ----- HEADER / STATS (neon) ----- */
    .game-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.2rem;
      margin-bottom: 1.8rem;
      color: #e0e0ff;
      text-shadow: 0 0 8px #7f7aff, 0 0 16px #4f4aff88;
    }

    .game-title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #b7aaff, #7a6eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px #7a6eff66;
      flex: 1 1 100%;
      text-align: center;
      margin-bottom: 0.2rem;
    }

    .stat-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      justify-content: center;
      flex: 2 1 auto;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.4rem 0.7rem;
      background: #12122a88;
      padding: 0.3rem 1rem 0.3rem 0.8rem;
      border-radius: 40px;
      border: 1px solid #5f55dd55;
      box-shadow: 0 0 12px #3f35bb33;
      backdrop-filter: blur(2px);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .stat-item span:first-child {
      opacity: 0.8;
      font-weight: 300;
    }

    .stat-value {
      min-width: 2.2rem;
      text-align: center;
      font-weight: 600;
      color: #f0eeff;
    }

    .stars-container {
      display: flex;
      gap: 0.2rem;
      font-size: 1.5rem;
      line-height: 1;
      letter-spacing: 2px;
    }

    .star {
      color: #b0aaff;
      text-shadow: 0 0 12px #b07aff, 0 0 24px #7a4eff;
      transition: 0.2s;
    }
    .star.active {
      color: #fcee7a;
      text-shadow: 0 0 16px #facc15, 0 0 30px #f59e0b;
    }

    /* ----- DIFFICULTY & CONTROLS (neon) ----- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .difficulty-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .neon-btn {
      background: #1c1c3a;
      border: 1px solid #5f55dd;
      color: #d0ccff;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 12px #3f35bb44, inset 0 0 6px #7a6eff33;
      transition: all 0.15s ease;
      backdrop-filter: blur(2px);
    }

    .neon-btn:hover {
      background: #2a2a5a;
      border-color: #a99eff;
      box-shadow: 0 0 20px #7a6effaa, inset 0 0 10px #b0aaff66;
      color: white;
      transform: scale(1.02);
    }

    .neon-btn:active {
      transform: scale(0.96);
    }

    .neon-btn.active-difficulty {
      background: #3f35bb;
      border-color: #c0b6ff;
      color: white;
      box-shadow: 0 0 28px #7a6effcc;
    }

    .new-game-btn {
      background: #3f2baa;
      border-color: #a99eff;
      padding: 0.4rem 1.8rem;
      font-size: 1rem;
      box-shadow: 0 0 20px #6a4eff88;
    }

    .new-game-btn:hover {
      background: #5f4aff;
      box-shadow: 0 0 30px #8f7aff;
    }

    /* ----- GRID (responsive) ----- */
    .grid-container {
      display: grid;
      gap: 0.7rem;
      justify-content: center;
      margin: 0 auto;
      transition: 0.25s;
    }

    /* card base */
    .card {
      aspect-ratio: 1 / 1;
      background: transparent;
      perspective: 800px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      border-radius: 18px;
      box-shadow: 0 0 12px #4f3fdd55, 0 4px 12px #0b0b1a;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      background: #1a1a3a;
      border: 1px solid #5f55dd88;
      box-shadow: inset 0 0 20px #3f35bb44;
      transition: box-shadow 0.2s;
    }

    .card-front {
      background: radial-gradient(circle at 30% 30%, #2a2a5a, #12122a);
      transform: rotateY(180deg);
      color: #f0eeff;
      text-shadow: 0 0 20px #b07aff, 0 0 40px #7a4eff;
    }

    .card-back {
      background: #1a1a3a;
      background-image: repeating-linear-gradient(45deg, #2f2f5a22 0px, #2f2f5a22 8px, #3f3f6a22 8px, #3f3f6a22 16px);
      border-color: #7a6eff66;
      color: #b0aaff;
      font-size: 2.8rem;
      font-weight: 300;
      text-shadow: 0 0 20px #7a6eff;
    }

    .card.matched .card-front {
      border-color: #a0ff9a;
      box-shadow: 0 0 30px #6aff66aa, inset 0 0 30px #6aff6644;
      background: #1a3a1a;
    }

    .card.matched {
      cursor: default;
      filter: drop-shadow(0 0 16px #6aff6688);
    }

    .card.shuffling .card-inner {
      animation: shufflePulse 0.3s ease 2;
    }

    @keyframes shufflePulse {
      0% { transform: scale(1) rotateY(0); }
      50% { transform: scale(0.92) rotateY(20deg); }
      100% { transform: scale(1) rotateY(0); }
    }

    /* ----- FOOTER / BEST SCORE ----- */
    .footer-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      color: #b0b0dd;
      font-size: 0.95rem;
      border-top: 1px solid #5f55dd44;
      padding-top: 1rem;
      gap: 0.5rem 1rem;
    }

    .best-score {
      background: #12122a88;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      border: 1px solid #5f55dd55;
      backdrop-filter: blur(2px);
    }

    .best-score span {
      font-weight: 600;
      color: #d0ccff;
    }

    /* ----- CONFETTI (simple overlay) ----- */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0.9;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 550px) {
      .game-wrapper { padding: 1rem 0.8rem; }
      .game-title { font-size: 1.5rem; }
      .stat-item { font-size: 0.9rem; padding: 0.2rem 0.8rem; }
      .card-front, .card-back { font-size: 1.8rem; }
      .neon-btn { font-size: 0.8rem; padding: 0.3rem 0.9rem; }
    }
  </style>
</head>
<body>
<div class="game-wrapper" role="main" aria-label="Neon Memory Match Game">
  <!-- header -->
  <div class="game-header">
    <div class="game-title">✦ NEON MATCH ✦</div>
    <div class="stat-group">
      <div class="stat-item"><span>🎯</span> <span class="stat-value" id="moveCounter">0</span></div>
      <div class="stat-item"><span>⏱️</span> <span class="stat-value" id="timerDisplay">0s</span></div>
      <div class="stat-item">
        <span>⭐</span>
        <span class="stars-container" id="starsContainer">
          <span class="star active" data-index="0">★</span>
          <span class="star active" data-index="1">★</span>
          <span class="star active" data-index="2">★</span>
        </span>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="difficulty-group">
      <button class="neon-btn active-difficulty" data-diff="easy">Easy (4x3)</button>
      <button class="neon-btn" data-diff="medium">Medium (4x4)</button>
      <button class="neon-btn" data-diff="hard">Hard (6x4)</button>
    </div>
    <button class="neon-btn new-game-btn" id="newGameBtn">⟳ New Game</button>
  </div>

  <!-- grid -->
  <div class="grid-container" id="gridContainer" role="grid" aria-label="Memory cards"></div>

  <!-- footer -->
  <div class="footer-stats">
    <div class="best-score">🏆 Best: <span id="bestScoreDisplay">—</span></div>
    <div id="gameMessage" style="font-style:italic; opacity:0.8;">✨ flip a card</div>
  </div>
</div>
